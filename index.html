<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="流程">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>流程</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <h1>流程</h1>
    <a class="btn-weather" href="https://map.wxnotam.com" target="_blank" rel="noopener">天气</a>
    <button id="btnFuel" class="btn-weather btn-fuel" type="button">油单</button>
    <button id="btnGear" class="btn-weather btn-gear" type="button">过夜装具</button>
  </div>
  <button id="btnResetAll" class="btn-reset-all" type="button">全部重置</button>
</header>

<nav class="tab-bar" id="tabBar">
  <!-- 标签由 JS 渲染 -->
</nav>

<main class="pages-viewport" id="pagesViewport">
  <div class="pages-track" id="pagesTrack">
    <!-- 页面由 JS 渲染 -->
  </div>
</main>

<!-- 油单页面（全屏覆盖层） -->
<div class="fuel-overlay" id="fuelOverlay" hidden>
  <div class="fuel-head">
    <button id="fuelBack" class="btn fuel-back" type="button">‹ 返回</button>
    <h2>油单</h2>
    <button id="fuelReset" class="btn fuel-reset" type="button">重置</button>
  </div>

  <div class="fuel-form">
    <div class="fuel-row">
      <label for="fuelDate">日期</label>
      <input type="text" id="fuelDate" inputmode="numeric" placeholder="如 20261102"
             autocomplete="off" enterkeyhint="done">
      <span id="fuelDateWarn" class="fuel-warn" hidden>⚠ 已过期</span>
    </div>

    <div class="fuel-row fuel-row-pair">
      <div class="fuel-cell">
        <label for="fuelDep">起飞</label>
        <input type="text" id="fuelDep" placeholder="____" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="fuel-cell">
        <label for="fuelArr">落地</label>
        <input type="text" id="fuelArr" placeholder="____" autocomplete="off" enterkeyhint="done">
      </div>
    </div>

    <div class="fuel-row fuel-row-pair">
      <div class="fuel-cell">
        <label for="fuelTotal">总油量</label>
        <input type="text" id="fuelTotal" inputmode="decimal" placeholder="____"
               autocomplete="off" enterkeyhint="done">
      </div>
      <div class="fuel-cell">
        <label>中间</label>
        <div class="fuel-mid" id="fuelMid"></div>
      </div>
    </div>
  </div>
</div>

<!-- 过夜装具页面（独立全屏覆盖层，不进入主标签栏） -->
<div class="gear-overlay" id="gearOverlay" hidden>
  <div class="gear-head">
    <button id="gearBack" class="btn gear-nav-btn" type="button">‹ 返回</button>
    <button id="gearReset" class="btn gear-nav-btn" type="button">重置本页</button>
  </div>

  <div class="gear-scroll">
    <h2 class="gear-title">过夜装具</h2>
    <p class="gear-progress" id="gearProgress"></p>

    <div id="gearGroups" class="gear-groups">
      <!-- 分组由 JS 渲染 -->
    </div>

    <button id="gearAddGroup" class="gear-add-group" type="button">＋ 添加分类</button>
  </div>
</div>

<!-- 底部抽屉：过夜装具（添加/编辑 分类 或 装具） -->
<div class="sheet-mask" id="gearSheetMask">
  <div class="sheet" id="gearSheet">
    <div class="sheet-handle"></div>
    <h2 id="gearSheetTitle">添加分类</h2>
    <input type="text" id="gearInput" class="sheet-input" maxlength="30" autocomplete="off">
    <div class="sheet-btns">
      <button type="button" class="btn sheet-btn-cancel" id="gearSheetCancel">取消</button>
      <button type="button" class="btn sheet-btn-ok" id="gearSheetOk">保存</button>
    </div>
  </div>
</div>

<!-- 底部抽屉：添加/编辑检查项 -->
<div class="sheet-mask" id="itemSheetMask">
  <div class="sheet" id="itemSheet">
    <div class="sheet-handle"></div>
    <h2 id="itemSheetTitle">添加检查项</h2>
    <input type="text" id="itemInput" class="sheet-input" placeholder="输入检查项内容" maxlength="60" autocomplete="off">
    <div class="sheet-btns">
      <button type="button" class="btn sheet-btn-cancel" id="itemSheetCancel">取消</button>
      <button type="button" class="btn sheet-btn-ok" id="itemSheetOk">保存</button>
    </div>
  </div>
</div>

<!-- 底部抽屉：添加/重命名标签页 -->
<div class="sheet-mask" id="tabSheetMask">
  <div class="sheet" id="tabSheet">
    <div class="sheet-handle"></div>
    <h2 id="tabSheetTitle">新增标签页</h2>
    <input type="text" id="tabInput" class="sheet-input" placeholder="输入标签页名称" maxlength="12" autocomplete="off">
    <div class="sheet-btns">
      <button type="button" class="btn sheet-btn-cancel" id="tabSheetCancel">取消</button>
      <button type="button" class="btn sheet-btn-ok" id="tabSheetOk">保存</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="sheet-mask" id="confirmMask">
  <div class="confirm-box">
    <h2 id="confirmTitle">确认</h2>
    <p id="confirmText" class="confirm-text"></p>
    <div class="sheet-btns">
      <button type="button" class="btn sheet-btn-cancel" id="confirmCancel">取消</button>
      <button type="button" class="btn sheet-btn-danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<!-- 检查项操作弹窗（编辑 / 删除） -->
<div class="sheet-mask" id="actionMask">
  <div class="action-box">
    <p class="action-target" id="actionTargetText"></p>
    <button type="button" class="btn action-btn" id="actionEdit">编辑</button>
    <button type="button" class="btn action-btn action-btn-danger" id="actionDelete">删除</button>
    <button type="button" class="btn action-btn action-btn-cancel" id="actionCancel">取消</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
